# This is the network config written by 'subiquity'
network:
  version: 2
  renderer: networkd
  ethernets:
    enp0s3:
      dhcp4: no
      addresses:
        - 192.168.0.200/24
      routes:
        - to: default
          via: 192.168.0.1
      nameservers:
        addresses: [8.8.8.8, 1.1.1.1]
  vlans:
    enp0s3.10:
      id: 10
      link: enp0s3
      addresses: [10.10.10.2/24]
    enp0s3.20:
      id: 20
      link: enp0s3
      addresses: [10.10.20.2/24]

